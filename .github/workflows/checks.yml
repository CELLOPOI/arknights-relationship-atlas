name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # 主分支发布完成一整份双镜像清单；新提交不打断正在发布的版本。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-source:
    name: frontend-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: make check-frontend
      - name: Record frontend check scope
        run: |
          echo 'Frontend checks passed: pinned resources, types, production build, game rules and graph data boundaries.' >> "$GITHUB_STEP_SUMMARY"

  backend-postgres:
    name: backend-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_check_ci
          POSTGRES_USER: atlas_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_test -d atlas_check_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ATLAS_TEST_DATABASE_URL: postgresql://atlas_test:local-ci-only@127.0.0.1:5432/atlas_check_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.12"
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: uv sync --project backend --frozen
      - run: make check-postgres
      - run: make check-tools

  container-images:
    name: container-${{ matrix.service }}
    needs: [frontend-source, backend-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: backend/Dockerfile
          - service: web
            dockerfile: frontend/Dockerfile
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      SERVICE: ${{ matrix.service }}
      # 不向构建摘要上传 Docker 记录；发布只包含显式选择的通用文件。
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image identity
        id: identity
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "assets=$(jq -r .version assets/resource-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Registry login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build containers
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.relationship-atlas.asset-version=${{ steps.identity.outputs.assets }}
          build-args: |
            CLOUDFLARE_WEB_ANALYTICS_TOKEN=
          cache-from: type=gha,scope=container-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.service }}
      - name: Check runtime image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
        shell: bash
        run: |
          if [[ "$SERVICE" == api ]]; then
            docker run --rm --network none --entrypoint .venv/bin/python "$IMAGE" -c 'import os,json,django,psycopg,gunicorn; from pathlib import Path; assert os.getuid()==10001; assert Path("staticfiles").is_dir() and os.access("staticfiles",os.W_OK); m=json.loads(Path("assets/preferences-manifest.json").read_text()); assert Path("assets/preferences").is_dir()'
          else
            docker run --rm --network none --entrypoint sh "$IMAGE" -ec 'test -s /srv/web/index.html; test -s /srv/web/avatars/unknown.svg; test -s /srv/web/assets/licenses/frontend-dependencies.txt; test -d /srv/web/assets/preferences; test -d /srv/web/illustrations; find /srv/web/assets -maxdepth 1 -name "*.js" | grep -q .'
          fi
      - name: Write image digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-metadata"
          jq -n --arg service "$SERVICE" --arg digest "$DIGEST" --arg git_commit "$GITHUB_SHA" '{service:$service,digest:$digest,git_commit:$git_commit}' > "$RUNNER_TEMP/image-metadata/${SERVICE}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.PUBLISH == 'true'
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image-metadata/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 3

  container-release:
    name: container-release
    needs: [container-images]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-*
          path: .runtime/image-metadata
          merge-multiple: true
      - name: Assemble release contract
        run: python3 scripts/container_release.py --image-directory .runtime/image-metadata --output .runtime/container-release --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="images-${GITHUB_SHA}"
          # 已公开的清单保持原摘要，重跑不得覆盖已部署版本；未完成草稿可以继续。
          if gh release view "$tag" --json isDraft > .runtime/existing-release.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft .runtime/existing-release.json)" == false ]]; then
              echo "Release already published: ${tag}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh release upload "$tag" .runtime/container-release/* --clobber
          else
            gh release create "$tag" .runtime/container-release/* --target "$GITHUB_SHA" --title "Container images ${GITHUB_SHA:0:12}" --notes "API and Web images from the checked commit. Use the immutable image references in release.json. Runtime configuration and databases are not included." --draft
          fi
          gh release edit "$tag" --draft=false --latest=false
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
